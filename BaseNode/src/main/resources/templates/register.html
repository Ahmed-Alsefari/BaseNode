<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaseNode Register</title>
    <link rel="icon" type="image/png" th:href="@{/images/BaseNode2.png}">
    <style>
        :root {
            --bg: #f0f0f0;
            --box-bg: white;
            --text: #333;
            --text-muted: #666;
            --input-border: #ccc;
            --shadow: rgba(0,0,0,0.1);
        }
        body.dark {
            --bg: #262626;
            --box-bg: #1f1f1e;
            --text: #e0e0e0;
            --text-muted: #999;
            --input-border: #444;
            --shadow: rgba(0,0,0,0.4);
        }
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            transition: background 0.3s;
        }
        .login-box {
            background: var(--box-bg);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 16px var(--shadow);
            width: 100%;
            max-width: 360px;
            position: relative;
            transition: background 0.3s;
        }
        .logo {
            display: block;
            margin: 0 auto 1.2rem auto;
            max-width: 180px;
            height: auto;
        }
        h2 { margin: 0 0 1.2rem; font-size: 1.3rem; color: var(--text); }
        label { display: block; margin: 0.6rem 0 0.25rem; color: var(--text); font-size: 14px; }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--input-border);
            border-radius: 5px;
            background: var(--bg);
            color: var(--text);
            font-size: 15px;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #007bff;
        }
        button[type="submit"] {
            width: 100%;
            padding: 0.75rem;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 1.2rem;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 0.3px;
        }
        button[type="submit"]:hover { background: #218838; }
        .error {
            color: #dc3545;
            background: #fff0f0;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            padding: 8px 12px;
            margin-bottom: 1rem;
            font-size: 13px;
        }
        .bottom-link { margin-top: 1.1rem; font-size: 14px; color: var(--text-muted); text-align: center; }
        .bottom-link a { color: #007bff; text-decoration: none; }
        .theme-toggle {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 5px 10px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--input-border);
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="login-box">
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
    <img src="/images/BaseNode.png" alt="logo"
         style="display:block; margin: 0 auto 1rem auto; max-width: 300px;" />
    <h2>Create Account</h2>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form th:action="@{/register}" th:object="${registerRequest}" method="post" novalidate>
        <label for="username">Username</label>
        <input type="text" id="username" th:field="*{username}"
               th:attr="data-error=${#fields.hasErrors('username')} ? ${#fields.errors('username')[0]} : ''" />

        <label for="password">Password</label>
        <input type="password" id="password" th:field="*{password}"
               th:attr="data-error=${#fields.hasErrors('password')} ? ${#fields.errors('password')[0]} : ''" />

        <button type="submit">Register</button>
    </form>

    <div class="bottom-link">
        Already have an account? <a th:href="@{/login}">Login here</a>
    </div>
</div>
<script>
    (function() {
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
    })();
    function toggleTheme() {
        const isDark = document.body.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
    }
    window.addEventListener('DOMContentLoaded', function() {
        if (document.body.classList.contains('dark'))
            document.getElementById('themeBtn').textContent = '☀️';
    });
    document.querySelectorAll('[data-error]').forEach(function(input) {
        var msg = input.getAttribute('data-error');
        if (msg) {
            input.setCustomValidity(msg);
            input.reportValidity();
            input.addEventListener('input', function() { input.setCustomValidity(''); });
        }
    });
</script>
</body>
</html>
