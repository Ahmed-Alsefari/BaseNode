<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BaseNode Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; }
        h2 { margin-top: 0; color: #333; }
        label { display: block; margin: 0.5rem 0 0.2rem; }
        input[type="text"], input[type="password"] { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 0.7rem; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 1rem; }
        .error { color: red; margin-bottom: 1rem; }
        .info { margin-top: 1rem; font-size: 0.9rem; color: #666; text-align: center; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>BaseNode Login</h2>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form method="post" th:action="@{/login}">
    <label for="username">Username:</label>
        <input type="text" id="username" name="username" required/>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required/>

        <button type="submit">Login</button>
    </form>

    <div class="info">
        Default: admin / 123456 (temp)
    </div>
</div>
</body>
</html>
