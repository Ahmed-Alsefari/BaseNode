spring.application.name=BaseNode

server.port=8080

# Thymeleaf configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false



server.error.include-message=always


# H2 database
spring.datasource.url=jdbc:h2:file:../basenode_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.generate-unique-name=false
spring.datasource.name=basenodedb

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true


# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Determine the size of files by uploading them
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
basenode.max-upload-size=500MB
server.tomcat.max-swallow-size=-1


# Security >>>
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO


# log
logging.file.name=logs/basenode.log
logging.pattern.console=%msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

logging.level.root=WARN
logging.level.com.BaseNode.BaseNode=INFO



# Disable timeout for SSE (Server-Sent Events) connections
spring.mvc.async.request-timeout=-1
